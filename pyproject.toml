[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-filter"
version = "2.0.0"
description = "An adaptive filter that reports the standing of its own answer, with no tuning parameters"
readme = "lucid/filter/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/michaelenew/lucid-filter"
Research = "https://github.com/michaelenew/lucid-filter/tree/main/research"

[tool.setuptools]
packages = ["lucid", "lucid.filter"]

[tool.pytest.ini_options]
testpaths = ["lucid/tests"]
