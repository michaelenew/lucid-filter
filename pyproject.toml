[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-filter"
version = "2.0.0"
description = "Adaptive filters that report the standing of their own answer, with no tuning parameters"
readme = "lucid/statfilter/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
fit = ["scipy>=1.8"]                  # only needed to learn parameters, not to filter
test = ["pytest>=7", "scipy>=1.8"]

[project.urls]
Homepage = "https://github.com/michaelenew/lucid-filter"
Research = "https://github.com/michaelenew/lucid-filter/tree/main/research"

[tool.setuptools]
packages = ["lucid", "lucid.statfilter", "lucid.odefilter"]

[tool.pytest.ini_options]
testpaths = ["lucid/tests"]
markers = ["slow: calls fit(); about a minute per series"]
